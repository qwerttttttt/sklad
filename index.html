<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f4c5c">
<link rel="manifest" href="manifest.json">
<title>Приёмка</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,Arial,sans-serif;background:#eceeea;color:#17202a;padding-bottom:48px}
header{position:sticky;top:0;background:#0f4c5c;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:5}
header h1{font-size:19px;margin:0;flex:1}
main{padding:12px;max-width:640px;margin:auto}
button,input,select,textarea{font:inherit;padding:13px;border-radius:10px;border:1px solid #b9c0b8;width:100%;margin-top:8px;background:#fff;color:inherit}
button{background:#0f4c5c;color:#fff;border:0;font-weight:600}
button.g{background:#2e7d32}button.s{background:#5b6770}button.r{background:#c62828}
button.w{width:auto;padding:8px 14px;margin:0}
.tabs{display:flex;gap:6px}
.tabs button{background:#d8dcd5;color:#2c3a3f;margin:0;padding:10px 4px;font-size:14px}
.tabs button.on{background:#0f4c5c;color:#fff}
.card{background:#fff;border-radius:12px;padding:12px;margin-top:10px;border-left:8px solid #e8a317;line-height:1.5}
.card.work{border-color:#0f4c5c}.card.done{border-color:#2e7d32}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #dde1da}
.bad{color:#c62828}.ok{color:#2e7d32}.muted{color:#5b6770;font-size:14px}
.bar{height:10px;background:#d8dcd5;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#2e7d32}
#st{padding:14px;border-radius:10px;text-align:center;font-weight:700;margin-top:8px;background:#d8dcd5}
h2{font-size:17px;margin:20px 0 4px}
.btns{display:flex;gap:8px}
</style>
</head>
<body>
<header><button class="w s" id="back" onclick="go()" hidden>←</button><h1 id="title">Приёмка грузов</h1></header>
<main id="app"></main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const KEY="sklad_v2";
let cargos=load(),cur=null,tab="work",ci=0,kb=true,form=false;

function load(){
  try{
    const d=localStorage.getItem(KEY);
    if(d)return JSON.parse(d);
    // перенос грузов из первой версии приложения
    const map={"ожидается":"wait","приёмка":"work","принят":"done"};
    return JSON.parse(localStorage.getItem("cargos")||"[]").map(o=>({
      id:o.id,supplier:o.supplier,invoice:"",truck:"",plan:null,note:"",
      status:map[o.status]||"wait",arrived:o.arrived,finished:o.finished,pallets:o.pallets||[],
      items:[{name:o.goods,exp:o.expected,fact:o.status==="принят"?o.accepted:null,defect:0,codes:[],mm:0}]}));
  }catch(e){return[]}
}
const save=()=>localStorage.setItem(KEY,JSON.stringify(cargos));
const getC=id=>cargos.find(c=>c.id===id);
const fmt=t=>t?new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const dur=c=>{if(!c.arrived||!c.finished)return"—";const m=Math.round((c.finished-c.arrived)/6e4);return m>=60?Math.floor(m/60)+" ч "+m%60+" мин":m+" мин"};
const need=i=>(i.fact==null?i.exp:i.fact)-(i.defect||0);
const marked=i=>i.codes.length+(i.mm||0);
const wsum=c=>Math.round(c.pallets.reduce((s,p)=>s+p.w,0)*10)/10;
const qsum=c=>c.pallets.reduce((s,p)=>s+(p.q||0),0);

function issues(c){
  const a=[];
  if(!c.pallets.length)a.push("Не взвешено ни одного палета");
  c.items.forEach(i=>{
    if(i.fact==null)a.push("Не введён пересчёт: "+i.name);
    else if(i.fact!==i.exp)a.push("Расхождение: "+i.name+" — ждали "+i.exp+", факт "+i.fact);
    if(marked(i)<need(i))a.push("Маркировка "+i.name+": "+marked(i)+" из "+need(i));
  });
  return a;
}

function go(id){cur=id||null;form=false;ci=0;render();scrollTo(0,0)}

function render(){
  $("back").hidden=!cur&&!form;
  $("title").textContent=form?"Новый груз":cur?"Груз":"Приёмка грузов";
  $("app").innerHTML=form?formHtml():cur?cargoHtml(getC(cur)):listHtml();
  if(form)addRow();
  const s=$("scan");if(s)s.focus();
}

function listHtml(){
  const names={wait:"Ожидаются",work:"В работе",done:"Готово"};
  let h='<div class="tabs">'+Object.keys(names).map(k=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${names[k]} (${cargos.filter(c=>c.status===k).length})</button>`).join("")+"</div>";
  h+='<button onclick="form=true;render()">+ Новый груз</button>';
  const l=cargos.filter(c=>c.status===tab).sort((a,b)=>b.id-a.id);
  if(!l.length)h+='<p class="muted">Здесь пока пусто.</p>';
  l.forEach(c=>{
    const m=c.items.reduce((s,i)=>s+marked(i),0),n=c.items.reduce((s,i)=>s+need(i),0);
    h+=`<div class="card ${c.status}" onclick="go(${c.id})"><b>${esc(c.supplier)}</b>${c.invoice?", накладная "+esc(c.invoice):""}<br><span class="muted">${c.items.map(i=>esc(i.name)).join(", ")}</span><br>`+
      (c.status==="wait"?"Ожидается: "+fmt(c.plan):"Пришёл: "+fmt(c.arrived)+(c.status==="done"?", "+dur(c):", маркировка "+m+" из "+n))+"</div>";
  });
  return h+'<h2>Данные</h2><button class="s" onclick="exportCsv()">Выгрузить в Excel (CSV)</button><button class="s" onclick="backup()">Сохранить резервную копию</button><button class="s" onclick="$(\'imp\').click()">Восстановить из копии</button><input id="imp" type="file" accept=".json" hidden onchange="restore(this)">';
}

function formHtml(){
  return `<input id="f_sup" placeholder="Поставщик *"><input id="f_inv" placeholder="Номер накладной"><input id="f_trk" placeholder="Номер машины"><label class="muted">Ожидаемое время прихода</label><input id="f_plan" type="datetime-local"><h2>Товары</h2><div id="rows"></div><button class="s" onclick="addRow()">+ Ещё товар</button><textarea id="f_note" placeholder="Комментарий"></textarea><button class="g" onclick="saveNew()">Сохранить груз</button>`;
}
function addRow(){
  const d=document.createElement("div");d.className="row";
  d.innerHTML='<input class="n" placeholder="Товар *"><input class="q" type="number" inputmode="numeric" placeholder="Кол-во *" style="width:40%">';
  $("rows").appendChild(d);
}
function saveNew(){
  const sup=$("f_sup").value.trim();
  const items=[...document.querySelectorAll("#rows .row")]
    .map(r=>({name:r.querySelector(".n").value.trim(),exp:Number(r.querySelector(".q").value)}))
    .filter(i=>i.name&&i.exp>0).map(i=>({...i,fact:null,defect:0,codes:[],mm:0}));
  if(!sup||!items.length){alert("Укажите поставщика и хотя бы один товар с количеством");return}
  const p=$("f_plan").value;
  cargos.push({id:Date.now(),supplier:sup,invoice:$("f_inv").value.trim(),truck:$("f_trk").value.trim(),plan:p?new Date(p).getTime():null,note:$("f_note").value.trim(),status:"wait",arrived:null,finished:null,pallets:[],items});
  save();tab="wait";go();
}

function cargoHtml(c){
  let h=`<div class="card ${c.status}"><b>${esc(c.supplier)}</b><br>Накладная: ${esc(c.invoice)||"—"}, машина: ${esc(c.truck)||"—"}<br>Ожидается: ${fmt(c.plan)}<br>Пришёл: ${fmt(c.arrived)}<br>Закончили: ${fmt(c.finished)}, длительность: ${dur(c)}`+(c.note?`<br><i>${esc(c.note)}</i>`:"")+"</div>";
  if(c.status==="wait")h+=`<button class="g" onclick="start(${c.id})">Груз приехал: начать приёмку</button>`;
  else{
    const ed=c.status==="work";
    h+="<h2>Палеты и вес</h2>";
    c.pallets.forEach((p,k)=>h+=`<div class="row"><span>Палет ${k+1}: ${p.w} кг${p.q?", "+p.q+" шт.":""}</span>${ed?`<button class="w r" onclick="delPallet(${c.id},${k})">✕</button>`:""}</div>`);
    if(c.pallets.length)h+=`<p><b>Палетов: ${c.pallets.length}, вес: ${wsum(c)} кг${qsum(c)?", по палетам: "+qsum(c)+" шт.":""}</b></p>`;
    if(ed)h+=`<button onclick="addPallet(${c.id})">+ Палет</button>`;
    h+="<h2>Вскрытие и пересчёт</h2>";
    c.items.forEach((i,k)=>h+=`<div class="row"><span>${esc(i.name)}<br><span class="muted">ждали ${i.exp}, факт <b class="${i.fact!=null&&i.fact!==i.exp?"bad":""}">${i.fact??"—"}</b>, брак ${i.defect||0}</span></span>${ed?`<button class="w" onclick="count(${c.id},${k})">Ввести</button>`:""}</div>`);
    h+="<h2>Маркировка «Честный знак»</h2>";
    c.items.forEach(i=>{const m=marked(i),n=need(i),pc=n>0?Math.min(100,m/n*100):0;h+=`<div style="margin-top:8px">${esc(i.name)}: <b class="${m>=n?"ok":""}">${m} из ${n}</b><div class="bar"><i style="width:${pc}%"></i></div></div>`});
    if(ed){
      h+=`<select onchange="ci=this.selectedIndex;$('scan').focus()">${c.items.map((i,k)=>`<option ${k===ci?"selected":""}>${esc(i.name)}</option>`).join("")}</select>`+
        `<input id="scan" placeholder="Сканируйте код (Enter)" autocomplete="off" inputmode="${kb?"text":"none"}" onkeydown="if(event.key==='Enter')doScan(${c.id})"><div id="st">Готов к сканированию</div>`+
        `<div class="btns"><button class="s" onclick="manual(${c.id},1)">+1 без кода</button><button class="s" onclick="manual(${c.id},-1)">−1</button><button class="s" onclick="kb=!kb;render()">⌨</button></div>`;
    }
    const is=issues(c);
    h+="<h2>Проверка</h2>"+(is.length?is.map(x=>`<div class="bad row">⚠ ${esc(x)}</div>`).join(""):'<div class="ok row">✓ Всё сходится</div>');
    h+=ed?`<button class="g" onclick="finish(${c.id})">Завершить приёмку</button>`:`<button class="s" onclick="reopen(${c.id})">Вернуть в работу</button>`;
  }
  return h+`<button class="r" onclick="del(${c.id})">Удалить груз</button>`;
}

function start(id){const c=getC(id);c.status="work";c.arrived=Date.now();save();tab="work";render()}
function reopen(id){const c=getC(id);c.status="work";c.finished=null;save();render()}
function del(id){if(confirm("Удалить груз полностью?")){cargos=cargos.filter(c=>c.id!==id);save();go()}}

function addPallet(id){
  const c=getC(id);
  const a=prompt("Вес палета, кг:");if(a===null)return;
  const w=Number(a.replace(",","."));
  if(!(w>0)){alert("Введите вес числом, например 450 или 12,5");return}
  const qs=prompt("Сколько штук на палете? (можно оставить пустым)");if(qs===null)return;
  const q=qs.trim()?Number(qs):null;
  if(q!==null&&(!Number.isInteger(q)||q<0)){alert("Количество: целое число");return}
  c.pallets.push({w,q});save();render();
}
function delPallet(id,k){if(confirm("Удалить палет "+(k+1)+"?")){getC(id).pallets.splice(k,1);save();render()}}

function count(id,k){
  const c=getC(id),i=c.items[k],s=qsum(c);
  const a=prompt("Фактическое количество: "+i.name+(s?" (по палетам: "+s+")":""),i.fact??(s&&c.items.length===1?s:i.exp));
  if(a===null)return;
  const f=Number(a);
  if(a.trim()===""||!Number.isInteger(f)||f<0){alert("Введите целое число");return}
  const b=prompt("Из них брак или повреждено (0, если нет)",i.defect||0);
  if(b===null)return;
  const d=Number(b);
  if(!Number.isInteger(d)||d<0||d>f){alert("Брак: целое число, не больше факта");return}
  i.fact=f;i.defect=d;save();render();
  if(f!==i.exp)alert("Расхождение: ждали "+i.exp+", факт "+f);
}

function allCodes(){const s=new Set();cargos.forEach(c=>c.items.forEach(i=>i.codes.forEach(x=>s.add(x))));return s}
function beep(f){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},f>500?120:400)}catch(e){}}
function setSt(t,bad){const s=$("st");if(!s)return;s.textContent=t;s.style.background=bad?"#c62828":"#2e7d32";s.style.color="#fff"}
function doScan(id){
  const inp=$("scan"),code=inp.value.trim();inp.value="";
  if(!code)return;
  const i=getC(id).items[ci];
  if(allCodes().has(code)){setSt("ДУБЛЬ! Код уже принят",true);beep(200);navigator.vibrate&&navigator.vibrate(300);return}
  if(marked(i)>=need(i)&&!confirm("Уже набрано "+marked(i)+" из "+need(i)+". Добавить ещё?"))return;
  i.codes.push(code);save();render();setSt("OK: "+marked(i)+" из "+need(i),false);beep(900);
}
function manual(id,d){
  const i=getC(id).items[ci];
  if(d>0){if(marked(i)>=need(i)&&!confirm("Уже набрано "+marked(i)+" из "+need(i)+". Добавить ещё?"))return;i.mm=(i.mm||0)+1}
  else if(i.mm>0)i.mm--;else i.codes.pop();
  save();render();
}

function finish(id){
  const c=getC(id),is=issues(c);
  if(is.length&&!confirm("Есть замечания:\n• "+is.join("\n• ")+"\n\nЗавершить всё равно?"))return;
  c.status="done";c.finished=Date.now();save();tab="done";go();
}

function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function exportCsv(){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',st={wait:"ожидается",work:"в работе",done:"принят"},f=t=>t?new Date(t).toLocaleString("ru-RU"):"";
  const rows=[["№","Поставщик","Накладная","Машина","Статус","Ожидали к","Пришёл","Закончили","Минут","Палетов","Вес, кг","Товар","Ожидали","Факт","Брак","Промаркировано"]];
  cargos.forEach(c=>c.items.forEach(i=>rows.push([c.id,c.supplier,c.invoice,c.truck,st[c.status],f(c.plan),f(c.arrived),f(c.finished),c.arrived&&c.finished?Math.round((c.finished-c.arrived)/6e4):"",c.pallets.length,String(wsum(c)).replace(".",","),i.name,i.exp,i.fact??"",i.defect||0,marked(i)])));
  download("priemka.csv","\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n"),"text/csv;charset=utf-8");
}
function backup(){download("priemka-backup.json",JSON.stringify(cargos),"application/json")}
function restore(el){
  const f=el.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm("Заменить текущие данные ("+cargos.length+" грузов) копией ("+d.length+")?")){cargos=d;save();render()}}catch(e){alert("Этот файл не подходит")}};
  r.readAsText(f);
}

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
render();
</script>
</body>
</html>
